<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link rel="stylesheet" href="map.css" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    
    <!-- ✅ Mapbox GL JS CSS -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <!-- ✅ Mapbox JS module -->
    <script src="map.js" type="module"></script>

    <style>
      #map {
        width: 100%;
        height: 500px;
      }
    </style>
  </head>

  <body>
    <h1>🚴🏼‍♀️ Bikewatching</h1>
    <!-- place this right under your <h1> (or wherever you like) -->
    <header id="time-filter">
    <label for="minute-slider">
      Filter by time:
      <input
        id="minute-slider"
        type="range"
        min="-1"
        max="1440"
        value="-1"
      />
      <time id="selected-time">(any time)</time>
      <em id="any-time-label">(any time)</em>
    </label>
    </header>
    <div id="map">
        <svg id="overlay"></svg>
      </div>
    <div class="legend">
        <div style="--departure-ratio: 1">More departures</div>
        <div style="--departure-ratio: 0.5">Balanced</div>
        <div style="--departure-ratio: 0">More arrivals</div>
    </div>
  </body>
</html>
